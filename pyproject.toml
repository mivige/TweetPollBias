[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bias_analysis"
version = "1.0.0"
description = "Multi-election Twitter social-poll bias analysis (US 2016, 2020, 2024): candidate ordering, appellatives, political leaning, sentiment, cognitive biases, and SCWG post-stratification."
authors = [
  { name = "Michele Vincenzo Gentile" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12.0"


[tool.ruff]
line-length = 99
src = ["bias_analysis"]
include = ["pyproject.toml", "bias_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bias_analysis"]
force-sort-within-sections = true

